      --bg-color: #0b0c0e;

      margin: 0;

      margin-bottom: 40px;
      gap: 12px;
      flex-wrap: wrap;

      align-items: center;
      gap: 12px;

      color: var(--text-main);

      gap: 10px;
    }

    .lang-switcher {

      display: inline-flex;
      align-items: center;
    }

      -webkit-appearance: none;
      background: rgba(26, 29, 36, 0.9);

      font-size: 13px;
      font-weight: 600;

    }

      font-weight: 600;

    .policy-card {

      border-radius: 20px;
      padding: 40px;
      backdrop-filter: blur(16px);

    .policy-tag {

      border: 1px solid rgba(56, 189, 248, 0.25);
      color: var(--accent-color);
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 10px;
    }

    .policy-meta {
      color: var(--text-sub);
      font-size: 14px;

    .policy-content h2 {
      font-size: 19px;
      font-weight: 700;
      color: var(--text-main);
      margin-top: 32px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;

      background: var(--accent-color);
      border-radius: 2px;

    .policy-content ul {

    .policy-content li {

    .policy-content strong {

      font-weight: 600;

    .policy-content a {

      padding-top: 30px;
      border-top: 1px solid var(--card-border);
      text-align: center;
      color: var(--text-dim);
      font-size: 13px;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .footer-links a {
      color: var(--text-sub);
      text-decoration: none;
      transition: color 0.2s;
    }

    .footer-links a:hover {
      color: var(--accent-color);
    }

    @media (max-width: 640px) {

</head>

  <script>
    const PRIVACY_I18N = {
      ko: {
        pageTitle: "개인정보 처리방침 | TimeTodo (타임투두)",
        backLinkText: "← 홈으로",
        policyTag: "LEGAL POLICY",
        policyTitle: "개인정보 처리방침 (Privacy Policy)",
        policyMeta: "최종 수정일: 2026년 11월 21일 • 시행일: 2026년 11월 21일",
        footerHome: "홈 (Home)",
        footerPrivacy: "개인정보 처리방침",
        footerContact: "문의하기 (Contact)",
        body: `
          <p><strong>TimeTodo (타임투두)</strong>(이하 "서비스" 또는 "앱")은 사용자의 개인정보와 프라이버시를 매우 중요하게 생각합니다. 본 개인정보 처리방침은 귀하가 TimeTodo 모바일 애플리케이션을 이용할 때 당사가 수집하는 정보, 이용 목적, 제3자 제공 및 정보 보호 조치에 대해 투명하게 설명합니다.</p>
          
          <p>TimeTodo는 <strong>사용자의 데이터 프라이버시 우선 원칙</strong>에 따라 설계되었으며, 사용자가 생성하는 할 일(Todo), 메모, 사진 등 모든 주요 작업 데이터는 외부 서버로 전송되지 않고 사용자의 기기(로컬 저장소) 내에 안전하게 보관됩니다.</p>

          <h2>1. 수집하는 개인정보 항목 및 수집 방법</h2>
          <p>당사는 서비스의 원활한 제공을 위해 필요한 최소한의 정보를 다음과 같이 처리합니다.</p>
          <ul>
            <li><strong>기기 내 로컬 저장 데이터 (외부 수집 안 함):</strong>
              사용자가 등록한 할 일(Todo) 제목 및 내용, 마감일/시간, 완료 여부, 카테고리 분류, 타임스탬프 카메라로 촬영한 사진 및 각인 정보는 <strong>오직 이용자의 기기 내부 저장소(Local Database / Shared Preferences / 기기 사진 보관함)에만 저장</strong>되며 당사의 서버로 전송되거나 저장되지 않습니다.
            </li>
            <li><strong>서비스 이용 과정에서 자동 수집되는 정보 (광고 및 통계):</strong>
              무료 버전 앱 이용 시, 제3자 광고 플랫폼(Google AdMob) 및 앱 프레임워크를 통해 기기 식별자(광고 ID / IDFA / GAID), 대략적인 기기 정보(기기 모델, OS 버전, 화면 해상도, 사용 언어), 광고 노출 및 클릭 로그 등이 자동으로 수집될 수 있습니다.
            </li>
            <li><strong>고객 문의 시 제공되는 정보:</strong>
              이메일 문의 시 사용자의 이메일 주소, 문의 내용 및 첨부 자료가 고객 지원 처리를 위해 수집됩니다.
            </li>
          </ul>

          <h2>2. 기기 접근 권한 및 이용 목적</h2>
          <p>TimeTodo는 핵심 기능을 수행하기 위해 모바일 기기의 특정 권한에 대한 승인을 요청할 수 있습니다.</p>
          <ul>
            <li><strong>카메라 (Camera) 접근 권한:</strong> 실시간 타임스탬프 스탬프가 각인되는 사진 촬영 기능을 제공하기 위해 사용됩니다.</li>
            <li><strong>사진 보관함 / 저장소 (Photos / Storage) 접근 권한:</strong> 사용자가 타임스탬프로 촬영한 사진을 기기 앨범에 안전하게 저장하기 위해 사용됩니다.</li>
            <li><strong>알림 (Notification) 권한:</strong> 잠금화면 최상단 Todo 표시 및 사용자가 설정한 마감 시한/리마인더 알림을 정시에 전달하기 위해 사용됩니다.</li>
          </ul>
          <p>※ 사용자는 언제든지 모바일 기기의 설정 메뉴에서 위 권한의 허용 여부를 변경하거나 철회할 수 있습니다. 권한을 허용하지 않아도 해당 권한이 불필요한 기본 할 일 기능은 정상적으로 이용하실 수 있습니다.</p>

          <h2>3. 개인정보의 이용 목적</h2>
          <p>수집되거나 처리되는 정보는 다음의 목적을 위해서만 이용됩니다.</p>
          <ul>
            <li>할 일 등록, 수정, 완료, 마감일 계산 등 핵심 투두 서비스 제공</li>
            <li>현재 시간 및 날짜가 각인되는 타임스탬프 사진 촬영 및 앨범 저장</li>
            <li>잠금화면 알림 서비스를 통한 실시간 최우선 할 일 표시</li>
            <li>활동 캘린더, 24시간 패턴 분석 등 기기 내 생산성 통계 산출</li>
            <li>Google AdMob을 통한 맞춤형/비맞춤형 배너 및 전면 광고 제공</li>
            <li>버그 개선, 앱 안정성 향상 및 고객 문의 대응</li>
          </ul>

          <h2>4. 개인정보의 제3자 제공 및 위탁</h2>
          <p>TimeTodo는 사용자의 개인정보를 판매, 대여하거나 외부에 무단으로 제공하지 않습니다. 단, 무료 서비스 유지를 위해 신뢰할 수 있는 글로벌 광고 파트너의 SDK가 앱에 포함되어 있습니다.</p>
          <ul>
            <li><strong>Google AdMob (Google LLC):</strong>
              앱 내 배너 광고 및 보상형 광고 게재, 광고 성과 분석 및 사기 방지 목적으로 광고 식별자 및 비식별 기기 정보를 수집 및 처리합니다.
              <br>• Google 개인정보 처리방침: <a href="https://policies.google.com/privacy" target="_blank" rel="noopener">https://policies.google.com/privacy</a>
            </li>
          </ul>

          <h2>5. 이용자의 권리 및 행사 방법 (GDPR, CCPA 등 준수)</h2>
          <p>이용자는 자신의 개인정보에 대해 언제든지 다음과 같은 권리를 행사할 수 있습니다.</p>
          <ul>
            <li><strong>데이터 접근 및 삭제:</strong> 앱 내에서 개별 할 일, 카테고리, 기록을 직접 삭제하거나, 앱 설정에서 초기화할 수 있습니다. 앱을 삭제(제거)할 경우 기기에 저장된 모든 로컬 데이터는 즉시 영구 삭제됩니다.</li>
            <li><strong>광고 추적 거부 (Opt-Out):</strong> 기기 설정(iOS: '설정 > 개인정보 보호 및 보안 > 추적', Android: '설정 > 보안 및 개인정보 보호 > 광고')에서 맞춤형 광고 추적을 비활성화할 수 있습니다.</li>
            <li><strong>문의 및 정정 요청:</strong> 고객지원 이메일을 통해 데이터 관련 문의나 권리 행사를 요청하실 수 있습니다.</li>
          </ul>

          <h2>6. 개인정보의 보유 및 파기 정책</h2>
          <ul>
            <li><strong>사용자 생성 데이터 (할 일, 메모, 사진):</strong> 이용자가 앱을 이용하는 동안 기기 내에만 보관되며, 앱 삭제 또는 개별 삭제 시 즉시 파기됩니다.</li>
            <li><strong>고객 문의 내역:</strong> 문의 접수 및 사후 지원을 위해 문의 해결 후 최대 1년간 보관된 후 안전하게 파기됩니다.</li>
            <li><strong>광고 SDK 자동 수집 로그:</strong> Google의 자체 데이터 보존 정책(최대 14~24개월)에 따릅니다.</li>
          </ul>

          <h2>7. 만 14세 미만 아동의 개인정보 보호</h2>
          <p>TimeTodo는 만 14세 미만(또는 해당 국가 법률이 정한 연령)의 아동을 대상으로 고의로 개인정보를 수집하지 않습니다. 아동이 부모의 동의 없이 개인정보를 제공한 사실을 인지하신 경우 즉시 당사로 연락 주시면 신속히 조치하겠습니다.</p>

          <h2>8. 개인정보의 기술적·관리적 보호 조치</h2>
          <p>당사는 이용자의 정보 보호를 위해 민감한 사용자 데이터를 외부 중앙 서버에 저장하지 않는 <strong>로컬 퍼스트(Local-First) 아키텍처</strong>를 채택하고 있으며, 운영체제가 제공하는 샌드박스 보안 저장소 내에서만 데이터를 안전하게 격리 보관합니다.</p>

          <h2>9. 개인정보 처리방침의 변경</h2>
          <p>본 방침은 관련 법령 개정 또는 서비스 기능 변경에 따라 개정될 수 있습니다. 중요한 변경 사항이 있을 경우 앱 내 공지 또는 본 웹페이지를 통해 사전 고지합니다.</p>

    function detectInitialLang() {
      const params = new URLSearchParams(window.location.search);
      const urlLang = params.get('lang');
      if (urlLang && PRIVACY_I18N[urlLang]) return urlLang;
      const saved = localStorage.getItem('timetodo_site_lang');
      if (saved && PRIVACY_I18N[saved]) return saved;
      const nav = (navigator.language || navigator.userLanguage || 'ko').toLowerCase();
      for (const code of Object.keys(PRIVACY_I18N)) {
        if (nav.startsWith(code)) return code;
      }
      return 'ko';
    }

    let currentLang = detectInitialLang();

    function applyLang(lang) {
      if (!PRIVACY_I18N[lang]) lang = 'en';
      currentLang = lang;
      localStorage.setItem('timetodo_site_lang', lang);
      document.documentElement.lang = lang;

      const t = PRIVACY_I18N[lang];
      document.title = t.pageTitle;
      document.getElementById('backLinkText').textContent = t.backLinkText;
      document.getElementById('policyTag').textContent = t.policyTag;
      document.getElementById('policyTitle').textContent = t.policyTitle;
      document.getElementById('policyMeta').textContent = t.policyMeta;
      document.getElementById('policyBody').innerHTML = t.body;
      document.getElementById('footerHome').textContent = t.footerHome;
      document.getElementById('footerPrivacy').textContent = t.footerPrivacy;
      document.getElementById('footerContact').textContent = t.footerContact;

      const homeHref = './?lang=' + lang;
      document.getElementById('brandLink').href = homeHref;
      document.getElementById('backLink').href = homeHref;
      document.getElementById('footerHome').href = homeHref;
      document.getElementById('footerPrivacy').href = 'privacy.html?lang=' + lang;

      const select = document.getElementById('langSelect');
      if (select.value !== lang) {
        select.value = lang;
      }
    }

    document.getElementById('langSelect').addEventListener('change', (e) => {
      applyLang(e.target.value);
    });

    applyLang(currentLang);
  </script>
